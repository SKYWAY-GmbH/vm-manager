name: Claude automatic review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip fork PRs (secret exposure) and bot PRs such as Dependabot and Renovate.
    if: github.event.pull_request.head.repo.full_name == github.repository && !endsWith(github.actor, '[bot]')
    runs-on: arc-skyway
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        env:
          ANTHROPIC_BASE_URL: http://192.168.60.63:8317
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.CLIPROXY_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The PR branch is already checked out in the current working directory.

            Review this pull request for:
            - bugs and regressions
            - security issues
            - breaking behavior
            - missing tests
            - serious performance problems

            Use `gh pr comment` for one top-level summary.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for specific code locations.
            Only post GitHub comments; do not submit review text as messages.
            Do not modify files and do not push commits.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --max-turns 80
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
